# INF-01 — frontend verification.
#
# All four checks must pass before a pull request merges. They are separate
# steps rather than one combined script so a failure names which check broke.
#
# Action versions use major tags for readability. Pinning them to commit SHAs
# is the supply-chain hardening step tracked under INF-02; a major tag is
# mutable and a compromised action release would run with repository
# permissions.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch: a force-push should not leave an
# obsolete run burning minutes and reporting a stale result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node version, shared with
          # developers using nvm.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` not `npm install`: it installs exactly the lockfile and fails
      # if package.json and the lockfile disagree, which is the reproducible
      # build INF-00 requires.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # src/api/schema.d.ts is a vendored copy of the backend contract. The
      # realistic failure mode is someone editing it to make a typecheck pass
      # instead of fixing the contract, which silently decouples this app from
      # the API. The generator banner is the cheap tripwire.
      #
      # True drift detection needs the sibling repository and is not possible
      # in this workflow without cross-repo access. Tracked as an INF-01
      # follow-up: either a read-only token or a published contract artifact.
      - name: Assert the vendored contract was not hand-edited
        run: |
          set -euo pipefail
          if ! head -4 src/api/schema.d.ts | grep -q 'auto-generated by openapi-typescript'; then
            echo "::error file=src/api/schema.d.ts::Generator banner missing. Regenerate with 'npm run api:types' rather than editing this file."
            exit 1
          fi
          echo "Vendored contract carries its generator banner."

      # The synthetic preview users and the component gallery must never reach
      # a production bundle. They are gated on import.meta.env.DEV, which Vite
      # replaces statically — but a refactor could reintroduce a runtime-only
      # guard, and a runtime guard still ships the data. This asserts the
      # dead-code elimination actually happened.
      - name: Assert development-only code is not in the bundle
        run: |
          set -euo pipefail
          for needle in "Галерея компонентов" "Просмотр оболочек" "Оператор ACE"; do
            if grep -rqF "$needle" dist/assets/*.js; then
              echo "::error::Development-only content found in production bundle: $needle"
              exit 1
            fi
          done
          echo "No development-only content in the production bundle."
